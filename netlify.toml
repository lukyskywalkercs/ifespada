[build]
  command = "npm run sync:firms && npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/firms/*"
  to = "https://firms.modaps.eosdis.nasa.gov/data/active_fire/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
